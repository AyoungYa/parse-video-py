# 无痕匠 · 云端 Nginx
# 职责：静态资源直出、/api 反代 Django、客户端上传体积放宽（视频 500MB）。
#
# ★ 域名 wuhenjiang.com 已注册，ICP 备案通过后按下面顺序启用 HTTPS：
#   1. 把证书文件放进 deploy/certs/（fullchain.pem / privkey.pem）
#   2. 取消下方 HTTPS server 块的注释
#   3. 把 80 端口块的 return 301 取消注释（强制跳转）
#   4. reload: docker compose exec nginx nginx -s reload

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name wuhenjiang.com www.wuhenjiang.com;

    # 备案通过 + HTTPS 启用后，取消下面这行的注释（80 全部跳 443）
    # return 301 https://$host$request_uri;

    client_max_body_size 600m;
    client_body_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    # Vue history 路由：找不到文件就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # claim 是 25 秒长轮询，读超时必须大于它，否则 worker 会拿到 504
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://django;
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---- HTTPS（备案通过 + 拿到证书后启用）----
server {
    listen 443 ssl http2;
    server_name wuhenjiang.com www.wuhenjiang.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 600m;
    client_body_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS：确认 HTTPS 稳定后再开（开了就很难改回来）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # claim 是 25 秒长轮询，读超时必须大于它
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://django;
        access_log off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
