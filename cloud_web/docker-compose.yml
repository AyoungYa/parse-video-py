services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${MYSQL_NAME:-wuhenjiang}
      MYSQL_USER: ${MYSQL_USER:-wuhenjiang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # 默认连 compose 内的 db 容器；.env 里填了 MYSQL_HOST 就用远程实例（此时 db 容器可停掉）
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/srv/staticfiles
    expose:
      - "8000"

  # 把前端构建产物拷进共享卷，供 nginx 直接服务（构建一次即退出）
  frontend:
    build:
      context: .
      target: frontend
    command: ["sh", "-c", "mkdir -p /out && cp -r /app/frontend/dist/. /out/"]
    volumes:
      - web_dist:/out

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static:/usr/share/nginx/static:ro
      - web_dist:/usr/share/nginx/html:ro
    depends_on:
      - web
      - frontend

  # 租约回收：算力机断电后靠它把任务放回队列。30 秒一次。
  reaper:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-db}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      while true; do
        python manage.py reclaim_leases || true;
        python manage.py expire_stale_uploads || true;
        sleep 30;
      done

volumes:
  mysql_data:
  static:
  web_dist:
