# 云端网页服务的依赖定义（唯一手写来源）
# 依赖管理器：uv。常用命令见 README「本地跑起来」。
[project]
name = "cloud-web"
version = "0.1.0"
description = "无痕匠 · 云端网页服务（Django API + Vue 前端）"
requires-python = ">=3.11"

dependencies = [
    # Web 框架。上限 <6.0 是硬约束：Django 6 移除了字段的 index= 参数，模型会直接报错。
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    # MySQL 驱动（走 PyMySQL，无需编译 mysqlclient）
    "pymysql>=1.1",
    # 阿里云 OSS：签发直传/下载用的临时 URL
    "oss2>=2.18",
    # 生产 WSGI
    "gunicorn>=22.0",
    # 阿里云短信（SMS_PROVIDER=aliyun 时才真正调用；本地 console 通道不会 import）
    "alibabacloud-dysmsapi20170525>=2.1.0",
    "alibabacloud-tea-openapi>=0.3.9",
    "python-dotenv>=1.0",
]

# 本项目是应用（有 manage.py），不是要发布到 PyPI 的库：不要打包安装自己。
[tool.uv]
package = false
