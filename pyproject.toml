[project]
name = "parse-video-py"
version = "0.0.3"
description = "视频解析服务，支持 20+ 平台去水印解析"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "aiohttp>=3.9",
    "fake-useragent>=1.5",
    "lxml>=5.0",
    "parsel>=1.9",
    "httpx>=0.27",
    "jmespath>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "fastapi-mcp>=0.4",
    "mcp>=1.12.0,<2.0.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
# cloud_web 与 gpu_worker 共用根目录虚拟环境。
services = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "pymysql>=1.1",
    "oss2>=2.18",
    "gunicorn>=22.0",
    "alibabacloud-dysmsapi20170525>=2.1.0",
    "alibabacloud-tea-openapi>=0.3.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.1",
    "scipy>=1.11",
    "simple-lama-inpainting>=0.1.0,<0.1.2",
    "torch>=2.3",
    "torchvision>=0.18",
]
# 去水印调参台（wm-studio）。与 web 一起装：uv pip install -e ".[web,wm]"
# torch 体积大且需按平台选源，故不并入 web，单独成组避免拖重纯解析服务。
wm = [
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.9",
    "scipy>=1.11",
    "pillow>=10.0",
    "numpy>=1.24,<2.0",
    "simple-lama-inpainting>=0.1.0,<0.1.2",
    "imageio-ffmpeg>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "pre-commit>=3.7",
]
# ★ all 刻意**不含 wm**：wm 依赖 torch（约 2GB），是单独的可选工具，
#   不该让"装全部"变成拉 2GB。要用调参台请显式 `.[web,wm]`。
all = ["parse-video-py[web,cli]"]

[project.scripts]
parse-video-py = "parse_video_py.cli:app"
wm-studio = "parse_video_py.wm_studio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parse_video_py"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
